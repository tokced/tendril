name: ci

on:
  push:
  pull_request:

jobs:
  mother:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 端到端测试（真起母端 + 子端进程）
        run: python3 -m unittest tests.test_mother -v

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 子端单测
        run: cd agent/go && go test ./...
      - name: 交叉编译检查
        run: |
          cd agent/go
          go build -trimpath -o /tmp/tendril-agent .
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/tendril-agent.exe .
          GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/tendril-agent-darwin .
