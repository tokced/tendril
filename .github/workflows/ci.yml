name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mother:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 端到端测试（真起母端 + 子端进程）
        run: python3 -m unittest tests.test_mother -v
      - name: 母端常驻脚本检查
        run: python3 -m unittest tests.test_deploy_assets -v

  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 平台适配单测（状态目录 / openssl / 本机 IP / 证书）
        run: python -m unittest tests.test_platform -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go/go.sum
      - name: 母端常驻脚本检查（非 Windows）
        if: runner.os != 'Windows'
        run: python -m unittest tests.test_deploy_assets -v
      - name: 子端单测
        run: cd agent/go && go test ./...
      - name: 子端构建
        run: cd agent/go && go build -trimpath -o tendril-agent .

  agent-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go/go.sum
      - name: 交叉编译检查
        run: |
          cd agent/go
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/tendril-agent.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -o /tmp/tendril-agent-linux .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o /tmp/tendril-agent-darwin .
